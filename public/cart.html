<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoltForge PC — Cart</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .cart-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .cart-item .thumb {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      background: #1e222c;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      color: var(--text-muted);
      overflow: hidden;
    }
    .cart-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item .info { flex: 1; }
    .cart-item .info h4 { font-size: 1rem; margin-bottom: 0.2rem; }
    .cart-item .info .unit-price { font-size: 0.85rem; color: var(--text-muted); }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .qty-controls button {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-dark);
      color: var(--text-main);
      cursor: pointer;
      font-size: 1rem;
    }
    .qty-controls span { min-width: 20px; text-align: center; }
    .cart-item .line-total { font-weight: 700; min-width: 90px; text-align: right; }
    .remove-btn {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .cart-summary {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-summary .total { font-size: 1.3rem; font-weight: 700; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="container">
    <div class="page-header">
      <h1>Your Cart</h1>
    </div>

    <div id="cartItems"></div>
    <div id="cartSummary"></div>
  </div>
  <div id="footer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/cart.js"></script>
    
</body>
</html>
