<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoltForge PC — Log In</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .auth-wrapper {
      max-width: 400px;
      margin: 4rem auto;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }
    .auth-wrapper h1 { font-size: 1.5rem; margin-bottom: 0.3rem; }
    .auth-wrapper p.subtitle { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 0.35rem; color: var(--text-muted); }
    .form-group input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-dark);
      color: var(--text-main);
      font-size: 0.95rem;
    }
    .form-group input:focus { outline: none; border-color: var(--accent); }
    .auth-wrapper .btn { width: 100%; margin-top: 0.5rem; }
    .toggle-mode { text-align: center; margin-top: 1.25rem; font-size: 0.88rem; color: var(--text-muted); }
    .toggle-mode a { color: var(--accent-secondary); cursor: pointer; }
    .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 0.75rem; min-height: 1.2em; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="auth-wrapper">
    <h1 id="formTitle">Welcome back</h1>
    <p class="subtitle" id="formSubtitle">Log in to your account</p>

    <form id="authForm">
      <div class="form-group hidden" id="nameGroup">
        <label>Full name</label>
        <input type="text" id="name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Log In</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <div class="toggle-mode">
      <span id="toggleText">Don't have an account? <a id="toggleLink">Sign up</a></span>
    </div>
  </div>
    <div id="footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
