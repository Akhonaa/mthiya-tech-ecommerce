<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mthiya Tech - Admin</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .admin-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 2rem;
      align-items: start;
    }
    @media (max-width: 800px) {
      .admin-layout { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }
    .panel h2 { font-size: 1.1rem; margin-bottom: 1rem; }
    .form-group { margin-bottom: 0.9rem; }
    .form-group label { display: block; font-size: 0.82rem; margin-bottom: 0.3rem; color: var(--text-muted); }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-dark);
      color: var(--text-main);
      font-size: 0.9rem;
      font-family: inherit;
    }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
    .form-row { display: flex; gap: 0.75rem; }
    .form-row .form-group { flex: 1; }

    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; }
    td input {
      width: 80px;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-dark);
      color: var(--text-main);
      font-size: 0.85rem;
    }
    .row-actions { display: flex; gap: 0.5rem; }
    .row-actions button {
      padding: 0.35rem 0.7rem;
      font-size: 0.78rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-dark);
      color: var(--text-main);
      cursor: pointer;
    }
    .row-actions button.save { border-color: var(--success); color: var(--success); }
    .row-actions button.delete { border-color: var(--danger); color: var(--danger); }
    .inactive-row { opacity: 0.4; }

        select.status-select {
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-dark);
      color: var(--text-main);
      font-size: 0.82rem;
    }
    td.issue-cell { max-width: 220px; font-size: 0.85rem; color: var(--text-muted); }
        .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
      width: 100%;
      max-width: 420px;
    }
    .modal-box h3 { margin-bottom: 1.2rem; font-size: 1.1rem; }
    .modal-actions { display: flex; gap: 0.75rem; margin-top: 1.25rem; }
    .modal-actions .btn { flex: 1; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="container" id="adminContent">
    <div class="page-header">
      <h1>Admin Panel</h1>
      <p>Manage your product catalogue, customer bookings and users.</p>
    </div>

    <div class="admin-layout">
      <div class="panel">
        <h2>Add New Product</h2>
        <form id="addProductForm">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="newName" required />
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="newDescription" rows="2"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Price (Rand)</label>
              <input type="number" id="newPrice" step="0.01" required />
            </div>
            <div class="form-group">
              <label>Stock</label>
              <input type="number" id="newStock" value="0" required />
            </div>
          </div>
          <div class="form-group">
            <label>Category</label>
            <input type="text" id="newCategory" placeholder="e.g. peripherals" />
          </div>
          <div class="form-group">
            <label>Image URL</label>
            <input type="text" id="newImageUrl" placeholder="https://..." />
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Add Product</button>
        </form>
      </div>

      <div class="panel">
        <h2>Product Catalogue</h2>
        <input type="text" id="productSearchInput" placeholder="Search products by name or category..." style="width: 100%; margin-bottom: 1rem; padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: var(--text-main);" />
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Price (R)</th>
              <th>Stock</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="productTableBody"></tbody>
        </table>
      </div>
    </div>
        <div class="panel" style="margin-top: 2rem;">
      <h2>Repair Bookings</h2>
      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>Device</th>
            <th>Issue</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Submitted</th>
          </tr>
        </thead>
        <tbody id="bookingsTableBody"></tbody>
      </table>
    </div>
           <div class="panel" style="margin-top: 2rem;">
      <h2>Manage Users</h2>
      <input type="text" id="userSearchInput" placeholder="Search users by name or email..." style="width: 100%; margin-bottom: 1rem; padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: var(--text-main);" />

      <form id="createUserForm" style="display: flex; gap: 0.6rem; margin-bottom: 1.25rem; flex-wrap: wrap;">
        <input type="text" id="newUserName" placeholder="Full name" required style="flex: 1; min-width: 140px; padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: var(--text-main);" />
        <input type="email" id="newUserEmail" placeholder="Email" required style="flex: 1; min-width: 160px; padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: var(--text-main);" />
        <input type="password" id="newUserPassword" placeholder="Password" required style="flex: 1; min-width: 140px; padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: var(--text-main);" />
        <select id="newUserRole" style="padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: var(--text-main);">
          <option value="customer">Customer</option>
          <option value="admin">Admin</option>
        </select>
        <button type="submit" class="btn btn-primary">Add User</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Joined</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="usersTableBody"></tbody>
      </table>
    </div>
  </div>

  
     <!-- Edit Product Modal -->
  <div class="modal-overlay" id="editProductModal">
    <div class="modal-box">
      <h3>Edit Product</h3>
      <form id="editProductForm">
        <input type="hidden" id="editProductId" />
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="editProductName" required />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="editProductDescription" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label>Category</label>
          <input type="text" id="editProductCategory" />
        </div>
        <div class="form-group">
          <label>Image URL</label>
          <input type="text" id="editProductImageUrl" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelProductEdit">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div class="modal-overlay" id="editUserModal">
    <div class="modal-box">
      <h3>Edit User</h3>
      <form id="editUserForm">
        <input type="hidden" id="editUserId" />
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="editUserName" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="editUserEmail" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelUserEdit">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
      <div id="footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
